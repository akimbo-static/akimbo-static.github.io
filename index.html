<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WARNER</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <article id="node" aria-label="Entry" tabindex="-1" hidden>
      <h1 id="node-title" hidden></h1>
      <div id="node-body"></div>
      <audio id="node-audio" controls preload="metadata" aria-label="Entry audio" hidden></audio>
    </article>
    <button id="drift" type="button" disabled>Drift</button>
    <p id="status" role="status"></p>
  </main>
